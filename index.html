<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Controle de Pintura de Meio-Fio - COLIMP / Prefeitura de Fortaleza</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      /* Paleta Oficial COLIMP / Prefeitura de Fortaleza */
      --laranja: #F15A22;
      --verde: #009889;
      --azul: #00A0DC;
      --petroleo: #325565;
      --grafite: #414042;
      --creme: #FFE6CB;
      --branco: #FFFFFF;

      /* Tons a 50% */
      --laranja-50: #F8AC90;
      --verde-50: #7FCBC4;
      --azul-50: #7FCFED;
      --petroleo-50: #98AAB2;

      /* Tipografia e Espaçamento (múltiplos de 8) */
      --fonte: Arial, Helvetica, sans-serif;
      --e1: 8px;
      --e2: 16px;
      --e3: 24px;
      --e4: 48px;
    }

    /* Regras Gerais: Arial, formas retas, sem cantos arredondados, sem sombra, sem degradê */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      box-shadow: none !important;
      font-family: var(--fonte);
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--creme);
      color: var(--grafite);
      overflow: hidden;
    }

    /* Cabeçalho Padrão Geral COLIMP (48px + bloco laranja 48px) */
    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--e4);
      background: var(--petroleo);
      color: var(--branco);
      flex-shrink: 0;
    }
    .topo__esquerda {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .topo__bloco {
      width: var(--e4);
      height: 100%;
      background: var(--laranja);
      flex-shrink: 0;
    }
    .topo__titulo {
      margin: 0 0 0 var(--e2);
      font-size: 18px;
      font-weight: bold;
      color: var(--branco);
      letter-spacing: 0.3px;
    }
    .topo__subtitulo {
      margin-left: var(--e2);
      font-size: 12px;
      color: var(--creme);
    }

    /* Seletor de Modo no Topo */
    .modos-container {
      display: flex;
      height: 100%;
      background: var(--petroleo);
    }
    .btn-modo {
      height: 100%;
      padding: 0 var(--e2);
      border: 0;
      border-left: 1px solid var(--petroleo-50);
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: var(--petroleo);
      color: var(--branco);
    }
    .btn-modo:focus-visible {
      outline: 3px solid var(--azul);
      outline-offset: -3px;
    }
    .btn-modo.ativo-pintura {
      background: var(--verde);
      color: var(--branco);
    }
    .btn-modo.ativo-rota {
      background: var(--laranja);
      color: var(--branco);
    }

    /* Área de Painel Institucional (Fundo Creme + Cartões Brancos) */
    #painel {
      background: var(--creme);
      padding: var(--e1) var(--e2);
      border-bottom: 2px solid var(--petroleo);
      display: flex;
      flex-direction: column;
      gap: var(--e1);
      z-index: 1000;
      flex-shrink: 0;
    }

    /* Barra de Progresso e Indicadores de Gestão */
    .progresso-card {
      background: var(--branco);
      padding: var(--e1) var(--e2);
      border-left: 6px solid var(--verde);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progresso-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--grafite);
      gap: var(--e1);
    }
    .progresso-info strong {
      color: var(--petroleo);
    }
    .badges-gestao {
      display: flex;
      flex-wrap: wrap;
      gap: var(--e1);
      font-size: 12px;
    }
    .badge {
      background: var(--creme);
      padding: 2px 8px;
      border-left: 3px solid var(--petroleo);
      color: var(--grafite);
    }
    .badge.vert { border-left-color: var(--azul); }
    .badge.horiz { border-left-color: var(--laranja); }

    .progresso-barra-bg {
      width: 100%;
      height: 10px;
      background: var(--petroleo-50);
    }
    .progresso-barra-fill {
      height: 100%;
      width: 0%;
      background: var(--verde);
      transition: width 0.25s ease;
    }

    /* Linha de Cartões KPI e Controles */
    .linha-controles {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: stretch;
      gap: var(--e1);
    }

    /* Cartões KPI com faixa lateral (Seção 4 do ID-VISUAL.md) */
    .kpis-grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--e1);
    }
    .kpi {
      background: var(--branco);
      padding: 6px 12px;
      border-left: 6px solid var(--cor, var(--petroleo));
      min-width: 105px;
    }
    .kpi strong {
      display: block;
      font-size: 18px;
      font-weight: bold;
      color: var(--petroleo);
      line-height: 1.2;
    }
    .kpi span {
      display: block;
      font-size: 11px;
      color: var(--grafite);
      text-transform: uppercase;
    }

    /* Botões e Filtros (Seção 4 e 7 do ID-VISUAL.md) */
    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: var(--e1);
      align-items: center;
    }

    select, button.acao {
      height: 36px;
      padding: 0 12px;
      border: 0;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    select {
      background: var(--branco);
      color: var(--petroleo);
      border: 2px solid var(--petroleo);
    }
    select:focus-visible, button.acao:focus-visible {
      outline: 3px solid var(--azul);
    }

    /* Botão Laranja Prioritário (Padrão Prefeitura) */
    .btn-laranja {
      background: var(--laranja);
      color: var(--branco);
    }
    .btn-laranja:hover {
      background: var(--petroleo);
    }

    /* Botão Verde (Meta / Concluir / Enviar) */
    .btn-verde {
      background: var(--verde);
      color: var(--branco);
    }
    .btn-verde:hover {
      background: var(--petroleo);
    }

    /* Botão Azul (Detalhes / Maps) */
    .btn-azul {
      background: var(--azul);
      color: var(--branco);
    }
    .btn-azul:hover {
      background: var(--petroleo);
    }

    /* Botão Azul-Petróleo (Secundário / Exportações) */
    .btn-petroleo {
      background: var(--petroleo);
      color: var(--branco);
    }
    .btn-petroleo:hover {
      background: var(--grafite);
    }

    /* Mapa */
    #map {
      flex: 1;
      width: 100%;
      background: var(--branco);
    }

    /* Legenda Institucional */
    .legenda {
      background: var(--branco);
      padding: var(--e1) 12px;
      border-left: 6px solid var(--petroleo);
      border-top: 1px solid var(--petroleo-50);
      border-right: 1px solid var(--petroleo-50);
      border-bottom: 1px solid var(--petroleo-50);
      font-size: 12px;
      line-height: 1.7;
      color: var(--grafite);
    }
    .legenda-titulo {
      font-weight: bold;
      color: var(--petroleo);
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 11px;
    }
    .cor {
      display: inline-block;
      width: 18px;
      height: 5px;
      margin-right: 8px;
      vertical-align: middle;
    }

    /* Faixa de Rodapé Institucional COLIMP (8px, cinco blocos) */
    .faixa {
      display: grid;
      grid-template-columns: 2fr 5fr 1fr 3fr 6fr;
      height: 8px;
      flex-shrink: 0;
    }
    .faixa i:nth-child(1), .faixa i:nth-child(5) { background: var(--verde); }
    .faixa i:nth-child(2), .faixa i:nth-child(4) { background: var(--laranja); }
    .faixa i:nth-child(3) { background: var(--azul); }

    @media (max-width: 900px) {
      .topo__subtitulo { display: none; }
      .topo__titulo { font-size: 15px; margin-left: var(--e1); }
      .btn-modo { padding: 0 10px; font-size: 12px; }
      #painel { padding: 6px var(--e1); gap: 6px; }
      .kpi { min-width: 85px; padding: 4px 8px; }
      .kpi strong { font-size: 15px; }
      select, button.acao { height: 32px; padding: 0 8px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho Padrão Geral COLIMP -->
  <header class="topo topo--geral">
    <div class="topo__esquerda">
      <span class="topo__bloco" aria-hidden="true"></span>
      <h1 class="topo__titulo">PINTURA DE MEIO-FIO • CENTRO DE FORTALEZA</h1>
      <span class="topo__subtitulo">COLIMP • Gestão Operacional de Campo</span>
    </div>

    <div class="modos-container">
      <button id="modo-pintura" class="btn-modo ativo-pintura" onclick="alterarModo('pintura')">
        1. MARCAR RUA PINTADA
      </button>
      <button id="modo-rota" class="btn-modo" onclick="alterarModo('rota')">
        2. MONTAR ROTEIRO DO DIA
      </button>
    </div>
  </header>

  <section id="painel">
    <!-- Cartão de Progresso Geral (Meta atingida = Verde #009889) -->
    <div class="progresso-card">
      <div class="progresso-info">
        <span>PROGRESSO GERAL: <strong id="pct-progresso">0,0%</strong> (<span id="resumo-geral">0,00 km de 0,00 km</span>)</span>
        <div class="badges-gestao">
          <span class="badge">Total de Ruas: <strong id="prog-ruas-total">0 / 0</strong></span>
          <span class="badge vert">Verticais: <strong id="prog-ruas-vert">0 / 0</strong></span>
          <span class="badge horiz">Horizontais: <strong id="prog-ruas-horiz">0 / 0</strong></span>
        </div>
      </div>
      <div class="progresso-barra-bg">
        <div id="barra-fill" class="progresso-barra-fill"></div>
      </div>
    </div>

    <div class="linha-controles">
      <!-- Cartões KPI com faixa lateral -->
      <div class="kpis-grid">
        <div class="kpi" style="--cor: var(--verde)">
          <strong id="qtd-pintadas">0</strong>
          <span>Ruas Pintadas</span>
        </div>
        <div class="kpi" style="--cor: var(--verde)">
          <strong id="total-pintado-m">0 m</strong>
          <span>Metros Pintados</span>
        </div>
        <div class="kpi" style="--cor: var(--verde)">
          <strong id="total-pintado-km">0,000 km</strong>
          <span>Km Pintados</span>
        </div>

        <div class="kpi" style="--cor: var(--petroleo)">
          <strong id="qtd-rota">0</strong>
          <span>Ruas no Roteiro</span>
        </div>
        <div class="kpi" style="--cor: var(--petroleo)">
          <strong id="total-rota-m">0 m</strong>
          <span>Metros Roteiro</span>
        </div>
        <div class="kpi" style="--cor: var(--petroleo)">
          <strong id="total-rota-km">0,000 km</strong>
          <span>Km Roteiro</span>
        </div>
      </div>

      <!-- Controles Operacionais -->
      <div class="acoes">
        <select id="multiplicador-lados" onchange="atualizarTudo()" aria-label="Quantidade de lados pintados">
          <option value="2" selected>Pintar 2 Lados da Rua</option>
          <option value="1">Pintar Apenas 1 Lado</option>
        </select>

        <select id="filtro-sentido" onchange="renderizarMapa()" aria-label="Filtrar vias no mapa">
          <option value="TODOS">Mostrar: Todas as Ruas</option>
          <option value="PENDENTES">Mostrar: Só Falta Pintar</option>
          <option value="PINTADAS">Mostrar: Só Já Pintadas</option>
          <option value="Vertical">Mostrar: Só Verticais</option>
          <option value="Horizontal">Mostrar: Só Horizontais</option>
        </select>

        <button class="acao btn-azul" onclick="abrirGoogleMaps()">Ver Trajeto no Maps</button>
        <button class="acao btn-verde" onclick="enviarWhatsApp()">Enviar p/ Equipe</button>
        <button class="acao btn-laranja" onclick="converterRotaEmPintura()">Confirmar Roteiro Pintado</button>
        <button class="acao btn-petroleo" onclick="exportarCSV()">Baixar Excel</button>
        <button class="acao btn-petroleo" onclick="exportarGeoJSON()">Arquivo QGIS</button>
        <button class="acao btn-petroleo" onclick="exportarBackup()">Salvar Cópia</button>
        <button class="acao btn-petroleo" onclick="document.getElementById('input-backup').click()">Abrir Cópia</button>
        <input type="file" id="input-backup" accept=".json" style="display:none" onchange="importarBackup(event)" />
        <button class="acao btn-laranja" onclick="limparDados()">Zerar</button>
      </div>
    </div>
  </section>

  <main id="map"></main>

  <!-- Faixa de Rodapé Institucional COLIMP (8px, cinco blocos) -->
  <footer class="faixa" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const COL_NOME = "name";
    const COL_METROS = "metros";
    const COL_SENTIDO = "Sentido";
    const STORAGE_KEY = "pintura_fortaleza_v3";

    // Cores oficiais do ID-VISUAL.md
    const COR_LARANJA = "#F15A22";
    const COR_VERDE = "#009889";
    const COR_AZUL = "#00A0DC";
    const COR_PETROLEO = "#325565";

    const map = L.map('map').setView([-3.7275, -38.5275], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap • Prefeitura de Fortaleza / COLIMP',
      maxZoom: 19
    }).addTo(map);

    let modoAtual = 'pintura';
    let dadosOriginais = null;
    let geojsonLayer = null;
    let pintadas = new Set();
    let roteiro = new Set();

    function formatarBR(valor, casas) {
      return Number(valor).toLocaleString('pt-BR', {
        minimumFractionDigits: casas,
        maximumFractionDigits: casas
      });
    }

    function carregarEstadoLocal() {
      const salvoV3 = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('pintura_fortaleza_v2');
      if (salvoV3) {
        try {
          const parsed = JSON.parse(salvoV3);
          pintadas = new Set(parsed.pintadas || []);
          roteiro = new Set(parsed.roteiro || []);
          if (parsed.lados) document.getElementById('multiplicador-lados').value = parsed.lados;
          return;
        } catch (e) {}
      }
      const salvoV1 = localStorage.getItem('pintura_fortaleza');
      if (salvoV1) {
        try {
          pintadas = new Set(JSON.parse(salvoV1));
          salvarProgresso();
        } catch (e) {}
      }
    }

    function salvarProgresso() {
      const payload = {
        pintadas: Array.from(pintadas),
        roteiro: Array.from(roteiro),
        lados: document.getElementById('multiplicador-lados').value,
        atualizadoEm: new Date().toISOString()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    carregarEstadoLocal();

    fetch('vias.geojson')
      .then(function(res) {
        if (!res.ok) throw new Error("Arquivo vias.geojson não encontrado.");
        return res.json();
      })
      .then(function(data) {
        dadosOriginais = data;
        data.features.forEach(function(f, idx) {
          f._id = idx;
        });
        renderizarMapa();
        atualizarCalculosGlobais();
      })
      .catch(function(err) {
        alert("Aviso: " + err.message);
      });

    function alterarModo(novoModo) {
      modoAtual = novoModo;
      document.getElementById('modo-pintura').className = 'btn-modo' + (novoModo === 'pintura' ? ' ativo-pintura' : '');
      document.getElementById('modo-rota').className = 'btn-modo' + (novoModo === 'rota' ? ' ativo-rota' : '');
    }

    function atualizarTudo() {
      renderizarMapa();
      atualizarCalculosGlobais();
    }

    function estiloVia(feature) {
      const id = feature._id;
      const estaNoRoteiro = roteiro.has(id);
      const estaPintada = pintadas.has(id);
      const sentido = feature.properties[COL_SENTIDO];

      // Roteiro do dia em Azul-petróleo destacado
      if (estaNoRoteiro) {
        return { color: COR_PETROLEO, weight: 7, opacity: 1, dashArray: estaPintada ? '10, 6' : null };
      }
      // Meta atingida / concluída sempre em Verde (#009889)
      if (estaPintada) {
        return { color: COR_VERDE, weight: 6, opacity: 0.95 };
      }
      // Pendentes: Vertical em Azul (#00A0DC), Horizontal em Laranja (#F15A22)
      return {
        color: sentido === 'Vertical' ? COR_AZUL : COR_LARANJA,
        weight: 4,
        opacity: 0.85
      };
    }

    function renderizarMapa() {
      if (!dadosOriginais) return;
      if (geojsonLayer) map.removeLayer(geojsonLayer);

      const filtro = document.getElementById('filtro-sentido').value;
      const fator = Number(document.getElementById('multiplicador-lados').value);

      geojsonLayer = L.geoJSON(dadosOriginais, {
        filter: function(feature) {
          if (filtro === 'TODOS') return true;
          if (filtro === 'PENDENTES') return !pintadas.has(feature._id);
          if (filtro === 'PINTADAS') return pintadas.has(feature._id);
          return feature.properties[COL_SENTIDO] === filtro;
        },
        style: estiloVia,
        onEachFeature: function(feature, layer) {
          const props = feature.properties;
          const nome = props[COL_NOME] || 'Rua sem nome';
          const m = Number(props[COL_METROS] || 0) * fator;
          const km = m / 1000;
          const sentido = props[COL_SENTIDO] || '-';

          layer.bindTooltip(function() {
            const status = roteiro.has(feature._id)
              ? 'NO ROTEIRO DO DIA'
              : (pintadas.has(feature._id) ? 'JÁ PINTADA' : 'FALTA PINTAR');
            return (
              '<div style="font-family:Arial,sans-serif; color:#414042;">' +
              '<strong style="color:#325565; font-size:13px;">' + nome + '</strong><br>' +
              'Extensão (' + fator + ' lado' + (fator > 1 ? 's' : '') + '): <strong>' + formatarBR(m, 0) + ' m</strong> (' + formatarBR(km, 3) + ' km)<br>' +
              'Sentido: ' + sentido + ' • <strong>' + status + '</strong>' +
              '</div>'
            );
          });

          layer.on('click', function() {
            const id = feature._id;
            if (modoAtual === 'pintura') {
              if (pintadas.has(id)) pintadas.delete(id);
              else pintadas.add(id);
            } else {
              if (roteiro.has(id)) roteiro.delete(id);
              else roteiro.add(id);
            }
            salvarProgresso();
            geojsonLayer.resetStyle(layer);
            atualizarCalculosGlobais();
          });
        }
      }).addTo(map);
    }

    function atualizarCalculosGlobais() {
      if (!dadosOriginais) return;
      const fator = Number(document.getElementById('multiplicador-lados').value);

      let totalPoligonalM = 0;
      let totalPintadoM = 0;
      let totalRotaM = 0;

      let totalVias = dadosOriginais.features.length;
      let viasPintadasTotal = 0;

      let totalVert = 0;
      let pintadasVert = 0;

      let totalHoriz = 0;
      let pintadasHoriz = 0;

      dadosOriginais.features.forEach(function(f) {
        const m = Number(f.properties[COL_METROS] || 0) * fator;
        const sentido = f.properties[COL_SENTIDO];
        const foiPintada = pintadas.has(f._id);

        totalPoligonalM += m;
        if (foiPintada) {
          totalPintadoM += m;
          viasPintadasTotal++;
        }
        if (roteiro.has(f._id)) totalRotaM += m;

        if (sentido === 'Vertical') {
          totalVert++;
          if (foiPintada) pintadasVert++;
        } else if (sentido === 'Horizontal') {
          totalHoriz++;
          if (foiPintada) pintadasHoriz++;
        }
      });

      const pct = totalPoligonalM > 0 ? ((totalPintadoM / totalPoligonalM) * 100) : 0;

      document.getElementById('pct-progresso').innerText = formatarBR(pct, 1) + '%';
      document.getElementById('resumo-geral').innerText =
        formatarBR(totalPintadoM / 1000, 2) + ' km de ' + formatarBR(totalPoligonalM / 1000, 2) + ' km';
      document.getElementById('barra-fill').style.width = Math.min(pct, 100).toFixed(1) + '%';

      document.getElementById('prog-ruas-total').innerText = viasPintadasTotal + ' / ' + totalVias;
      document.getElementById('prog-ruas-vert').innerText = pintadasVert + ' / ' + totalVert;
      document.getElementById('prog-ruas-horiz').innerText = pintadasHoriz + ' / ' + totalHoriz;

      document.getElementById('qtd-pintadas').innerText = pintadas.size;
      document.getElementById('total-pintado-m').innerText = formatarBR(totalPintadoM, 0) + ' m';
      document.getElementById('total-pintado-km').innerText = formatarBR(totalPintadoM / 1000, 3) + ' km';

      document.getElementById('qtd-rota').innerText = roteiro.size;
      document.getElementById('total-rota-m').innerText = formatarBR(totalRotaM, 0) + ' m';
      document.getElementById('total-rota-km').innerText = formatarBR(totalRotaM / 1000, 3) + ' km';

      salvarProgresso();
    }

    function converterRotaEmPintura() {
      if (roteiro.size === 0) return alert("Nenhuma rua selecionada no Roteiro do Dia.");
      if (!confirm("Confirmar que as " + roteiro.size + " ruas do roteiro já foram pintadas?")) return;

      roteiro.forEach(function(id) { pintadas.add(id); });
      roteiro.clear();
      salvarProgresso();
      renderizarMapa();
      atualizarCalculosGlobais();
    }

    function obterTrajetoCompletoOrdenado() {
      const trechos = [];
      roteiro.forEach(function(id) {
        const f = dadosOriginais.features[id];
        if (!f) return;

        let inicio, fim;
        if (f.geometry.type === 'MultiLineString') {
          const linhas = f.geometry.coordinates;
          inicio = linhas[0][0];
          const ultimaLinha = linhas[linhas.length - 1];
          fim = ultimaLinha[ultimaLinha.length - 1];
        } else {
          const coords = f.geometry.coordinates;
          inicio = coords[0];
          fim = coords[coords.length - 1];
        }

        trechos.push({
          feature: f,
          inicioLat: inicio[1],
          inicioLng: inicio[0],
          fimLat: fim[1],
          fimLng: fim[0],
          inicioStr: inicio[1].toFixed(6) + ',' + inicio[0].toFixed(6),
          fimStr: fim[1].toFixed(6) + ',' + fim[0].toFixed(6)
        });
      });

      if (trechos.length <= 1) return trechos;

      const ordenados = [trechos.shift()];
      while (trechos.length > 0) {
        const atual = ordenados[ordenadas.length - 1];
        let melhorIdx = 0;
        let menorDist = Infinity;
        let inverterProximo = false;

        for (let i = 0; i < trechos.length; i++) {
          const cand = trechos[i];
          const distDireta = Math.pow(atual.fimLat - cand.inicioLat, 2) + Math.pow(atual.fimLng - cand.inicioLng, 2);
          const distInvertida = Math.pow(atual.fimLat - cand.fimLat, 2) + Math.pow(atual.fimLng - cand.fimLng, 2);

          if (distDireta < menorDist) {
            menorDist = distDireta;
            melhorIdx = i;
            inverterProximo = false;
          }
          if (distInvertida < menorDist) {
            menorDist = distInvertida;
            melhorIdx = i;
            inverterProximo = true;
          }
        }

        const escolhido = trechos.splice(melhorIdx, 1)[0];
        if (inverterProximo) {
          const tempStr = escolhido.inicioStr;
          escolhido.inicioStr = escolhido.fimStr;
          escolhido.fimStr = tempStr;
          const tempLat = escolhido.inicioLat;
          const tempLng = escolhido.inicioLng;
          escolhido.inicioLat = escolhido.fimLat;
          escolhido.inicioLng = escolhido.fimLng;
          escolhido.fimLat = tempLat;
          escolhido.fimLng = tempLng;
        }
        ordenados.push(escolhido);
      }
      return ordenados;
    }

    function gerarLinkGoogleMaps(trechosOrdenados) {
      const pontos = [];
      trechosOrdenados.forEach(function(t) {
        if (pontos.length === 0 || pontos[pontos.length - 1] !== t.inicioStr) {
          pontos.push(t.inicioStr);
        }
        if (pontos[pontos.length - 1] !== t.fimStr) {
          pontos.push(t.fimStr);
        }
      });

      const limite = pontos.slice(0, 10);
      const destino = limite[limite.length - 1];
      const waypoints = limite.slice(0, -1).join('|');

      let url = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(destino) + '&travelmode=walking';
      if (waypoints) url += '&waypoints=' + encodeURIComponent(waypoints);
      return url;
    }

    function abrirGoogleMaps() {
      if (roteiro.size === 0) {
        return alert("Clique primeiro no botão '2. MONTAR ROTEIRO DO DIA' e selecione as ruas no mapa.");
      }
      const ordenados = obterTrajetoCompletoOrdenado();
      if (ordenados.length > 5) {
        alert("Nota: O Google Maps desenhará o trajeto exato (início e fim) das primeiras 5 ruas selecionadas.");
      }
      window.open(gerarLinkGoogleMaps(ordenados), '_blank');
    }

    function enviarWhatsApp() {
      if (roteiro.size === 0) {
        return alert("Clique primeiro no botão '2. MONTAR ROTEIRO DO DIA' e selecione as ruas no mapa.");
      }
      const fator = Number(document.getElementById('multiplicador-lados').value);
      const ordenados = obterTrajetoCompletoOrdenado();
      let totalM = 0;

      const linhasRuas = ordenados.map(function(item, index) {
        const props = item.feature.properties;
        const nome = props[COL_NOME] || 'Trecho sem nome';
        const m = Number(props[COL_METROS] || 0) * fator;
        totalM += m;
        return (index + 1) + '. ' + nome + ' — ' + formatarBR(m, 0) + ' m (' + formatarBR(m / 1000, 2) + ' km)';
      });

      const linkMaps = gerarLinkGoogleMaps(ordenados);
      const texto =
        '*ROTEIRO PINTURA DE MEIO-FIO • CENTRO (COLIMP)*\n' +
        'Total a Pintar (' + fator + ' lado' + (fator > 1 ? 's' : '') + '): ' + formatarBR(totalM, 0) + ' m (' + formatarBR(totalM / 1000, 2) + ' km)\n\n' +
        '*Ordem das Ruas (Início ao Fim):*\n' + linhasRuas.join('\n') + '\n\n' +
        '*Abrir Trajeto Desenhado no Mapa:*\n' + linkMaps;

      window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
    }

    function exportarCSV() {
      if (!dadosOriginais) return;
      const fator = Number(document.getElementById('multiplicador-lados').value);
      const linhas = ["Nome_da_Rua;Sentido;Situacao;Metros_Pintados;Quilometros_Km"];

      dadosOriginais.features.forEach(function(f) {
        const p = f.properties;
        const nome = (p[COL_NOME] || 'Sem nome').replace(/;/g, ',');
        const sentido = p[COL_SENTIDO] || '-';
        const mTotal = Number(p[COL_METROS] || 0) * fator;
        const kmTotal = mTotal / 1000;
        const status = pintadas.has(f._id) ? 'Pintada' : (roteiro.has(f._id) ? 'No Roteiro' : 'Falta Pintar');

        const mFormatado = mTotal.toFixed(2).replace('.', ',');
        const kmFormatado = kmTotal.toFixed(3).replace('.', ',');

        linhas.push('"' + nome + '";' + sentido + ';' + status + ';' + mFormatado + ';' + kmFormatado);
      });

      baixarArquivo("\uFEFF" + linhas.join("\n"), 'planilha_pintura_centro_' + dataHoje() + '.csv', "text/csv;charset=utf-8;");
    }

    function exportarGeoJSON() {
      if (!dadosOriginais) return;
      const fator = Number(document.getElementById('multiplicador-lados').value);
      const copia = JSON.parse(JSON.stringify(dadosOriginais));

      copia.features.forEach(function(f) {
        const id = f._id;
        delete f._id;
        const mBase = Number(f.properties[COL_METROS] || 0);
        f.properties.status_pintura = pintadas.has(id) ? 'Concluida' : (roteiro.has(id) ? 'Roteiro' : 'Pendente');
        f.properties.lados = fator;
        f.properties.metros_totais = Number((mBase * fator).toFixed(2));
        f.properties.km_totais = Number(((mBase * fator) / 1000).toFixed(3));
      });

      baixarArquivo(JSON.stringify(copia, null, 2), 'vias_centro_atualizado_' + dataHoje() + '.geojson', "application/geo+json");
    }

    function exportarBackup() {
      const dados = localStorage.getItem(STORAGE_KEY) || '{}';
      baixarArquivo(dados, 'copia_pintura_fortaleza_' + dataHoje() + '.json', "application/json");
    }

    function importarBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed.pintadas)) throw new Error("Arquivo inválido.");
          pintadas = new Set(parsed.pintadas);
          roteiro = new Set(parsed.roteiro || []);
          if (parsed.lados) document.getElementById('multiplicador-lados').value = parsed.lados;
          salvarProgresso();
          renderizarMapa();
          atualizarCalculosGlobais();
          alert("Cópia carregada com sucesso!");
        } catch (err) {
          alert("Erro ao ler arquivo: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function limparDados() {
      const opcao = prompt(
        "O que você deseja limpar?\nDigite 1 = Limpar APENAS o Roteiro do Dia\nDigite 2 = Zerar TUDO (apagar todas as ruas pintadas)"
      );
      if (opcao === '1') {
        roteiro.clear();
      } else if (opcao === '2') {
        if (!confirm("Tem certeza que deseja apagar todo o progresso de ruas pintadas?")) return;
        pintadas.clear();
        roteiro.clear();
      } else {
        return;
      }
      salvarProgresso();
      renderizarMapa();
      atualizarCalculosGlobais();
    }

    function baixarArquivo(conteudo, nomeArquivo, tipoMime) {
      const blob = new Blob([conteudo], { type: tipoMime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nomeArquivo;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function dataHoje() {
      return new Date().toISOString().slice(0, 10);
    }

    const legenda = L.control({ position: 'bottomright' });
    legenda.onAdd = function() {
      const div = L.DomUtil.create('div', 'legenda');
      div.innerHTML =
        '<div class="legenda-titulo">Legenda das Vias</div>' +
        '<div><span class="cor" style="background:#00A0DC"></span>Vertical (Falta Pintar)</div>' +
        '<div><span class="cor" style="background:#F15A22"></span>Horizontal (Falta Pintar)</div>' +
        '<div><span class="cor" style="background:#009889; height:6px"></span>Já Pintada (Meta)</div>' +
        '<div><span class="cor" style="background:#325565; height:7px"></span>Roteiro do Dia</div>';
      return div;
    };
    legenda.addTo(map);
  </script>
