<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Controle de Pintura - Centro de Fortaleza</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0f172a; overflow: hidden; }

    /* Painel Superior */
    #painel {
      background: #1e293b; color: #f8fafc; padding: 10px 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4); z-index: 1000;
      display: flex; flex-direction: column; gap: 8px;
    }

    .linha-topo {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    }

    .titulo h1 { font-size: 1.05rem; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .titulo p { font-size: 0.75rem; color: #94a3b8; }

    /* Seletor de Modo Operacional */
    .modos-container {
      display: flex; background: #0f172a; padding: 4px; border-radius: 8px; gap: 4px; border: 1px solid #334155;
    }
    .btn-modo {
      padding: 6px 12px; border-radius: 6px; border: none; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; background: transparent; color: #94a3b8; transition: all 0.2s;
    }
    .btn-modo.ativo-pintura { background: #16a34a; color: white; }
    .btn-modo.ativo-rota { background: #9333ea; color: white; }

    /* Barra de Progresso Geral */
    .progresso-wrapper {
      background: #0f172a; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155;
    }
    .progresso-info {
      display: flex; justify-content: space-between; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 4px;
    }
    .progresso-barra-bg {
      width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden;
    }
    .progresso-barra-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.3s ease;
    }

    /* Contadores e Ações */
    .linha-controles {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
    }

    .contadores {
      display: flex; gap: 12px; background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155;
    }
    .box-num { text-align: center; }
    .box-num span { display: block; font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }
    .box-num strong { font-size: 0.95rem; }
    .cor-pintura { color: #4ade80; }
    .cor-rota { color: #c084fc; }

    .acoes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    select, button.acao {
      padding: 7px 10px; border-radius: 6px; border: none; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    select { background: #334155; color: white; border: 1px solid #475569; }
    .btn-rota { background: #2563eb; color: white; }
    .btn-rota:hover { background: #1d4ed8; }
    .btn-zap { background: #16a34a; color: white; }
    .btn-zap:hover { background: #15803d; }
    .btn-concluir-rota { background: #7e22ce; color: white; }
    .btn-concluir-rota:hover { background: #6b21a8; }
    .btn-sec { background: #475569; color: white; }
    .btn-sec:hover { background: #334155; }
    .btn-limpar { background: #dc2626; color: white; }

    /* Mapa e Legenda */
    #map { flex: 1; width: 100%; }
    .legenda {
      background: rgba(255, 255, 255, 0.95); padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 0.78rem; line-height: 1.65; color: #1e293b;
    }
    .cor { display: inline-block; width: 16px; height: 4px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }

    @media (max-width: 768px) {
      .titulo p { display: none; }
      #painel { padding: 8px 10px; gap: 6px; }
      select, button.acao { padding: 6px 8px; font-size: 0.74rem; }
    }
  </style>
</head>
<body>

  <div id="painel">
    <div class="linha-topo">
      <div class="titulo">
        <h1>🖌️ Pintura de Meio-Fio • Centro</h1>
        <p>Poligonal Centro de Fortaleza • Gestão de Campo</p>
      </div>

      <!-- Alternador de Modo -->
      <div class="modos-container">
        <button id="modo-pintura" class="btn-modo ativo-pintura" onclick="alterarModo('pintura')">
          ✅ Registrar Pintura
        </button>
        <button id="modo-rota" class="btn-modo" onclick="alterarModo('rota')">
          🗺️ Montar Roteiro Garis
        </button>
      </div>
    </div>

    <!-- Barra de Progresso Geral da Poligonal -->
    <div class="progresso-wrapper">
      <div class="progresso-info">
        <span>Progresso Geral do Centro: <strong id="pct-progresso">0.0%</strong></span>
        <span id="resumo-geral">0 m / 0 m</span>
      </div>
      <div class="progresso-barra-bg">
        <div id="barra-fill" class="progresso-barra-fill"></div>
      </div>
    </div>

    <div class="linha-controles">
      <!-- Contadores Dinâmicos -->
      <div class="contadores">
        <div class="box-num">
          <span>Pintadas</span>
          <strong class="cor-pintura" id="qtd-pintadas">0</strong>
        </div>
        <div class="box-num">
          <span>Total Pintado</span>
          <strong class="cor-pintura" id="total-pintado-m">0 m</strong>
        </div>
        <div class="box-num">
          <span>No Roteiro</span>
          <strong class="cor-rota" id="qtd-rota">0</strong>
        </div>
        <div class="box-num">
          <span>Metros Roteiro</span>
          <strong class="cor-rota" id="total-rota-m">0 m</strong>
        </div>
      </div>

      <!-- Filtros e Botões -->
      <div class="acoes">
        <select id="multiplicador-lados" onchange="atualizarCalculosGlobais()" title="Pintura em 1 ou 2 lados do meio-fio">
          <option value="1">1 Lado (1x)</option>
          <option value="2">2 Lados (2x)</option>
        </select>

        <select id="filtro-sentido" onchange="renderizarMapa()">
          <option value="TODOS">Todas as Vias</option>
          <option value="Vertical">Apenas Verticais</option>
          <option value="Horizontal">Apenas Horizontais</option>
          <option value="PENDENTES">Apenas Pendentes</option>
          <option value="PINTADAS">Apenas Pintadas</option>
        </select>

        <button class="acao btn-rota" onclick="abrirGoogleMaps()">🗺️ Maps</button>
        <button class="acao btn-zap" onclick="enviarWhatsApp()">📲 WhatsApp</button>
        <button class="acao btn-concluir-rota" onclick="converterRotaEmPintura()" title="Marca todas as vias do roteiro atual como concluídas">✔️ Concluir Rota</button>
        <button class="acao btn-sec" onclick="exportarCSV()">📊 Excel/CSV</button>
        <button class="acao btn-sec" onclick="exportarGeoJSON()">🌍 GeoJSON</button>
        <button class="acao btn-sec" onclick="exportarBackup()">💾 Backup</button>
        <button class="acao btn-sec" onclick="document.getElementById('input-backup').click()">📂 Restaurar</button>
        <input type="file" id="input-backup" accept=".json" style="display:none" onchange="importarBackup(event)" />
        <button class="acao btn-limpar" onclick="limparDados()">🗑️ Limpar</button>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // Nomes das colunas exportadas do QGIS
    const COL_NOME = "name";
    const COL_METROS = "metros";
    const COL_KM = "km";
    const COL_SENTIDO = "Sentido";
    const STORAGE_KEY = "pintura_fortaleza_v2";

    // Inicialização do Mapa
    // Opção A: OpenStreetMap Oficial (sem chave, mostra nomes de ruas e comércios bem nítidos)
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

    // Estado da Aplicação
    let modoAtual = 'pintura'; // 'pintura' ou 'rota'
    let dadosOriginais = null;
    let geojsonLayer = null;
    let pintadas = new Set(); // IDs das vias já pintadas
    let roteiro = new Set();  // IDs das vias planejadas no roteiro do dia

    // Carregar estado salvo no navegador (com migração da v1 se existir)
    function carregarEstadoLocal() {
      const salvoV2 = localStorage.getItem(STORAGE_KEY);
      if (salvoV2) {
        try {
          const parsed = JSON.parse(salvoV2);
          pintadas = new Set(parsed.pintadas || []);
          roteiro = new Set(parsed.roteiro || []);
          if (parsed.lados) document.getElementById('multiplicador-lados').value = parsed.lados;
          return;
        } catch (e) { console.error("Erro ao ler storage v2:", e); }
      }
      // Migração automática do formato antigo (pintura_fortaleza)
      const salvoV1 = localStorage.getItem('pintura_fortaleza');
      if (salvoV1) {
        try {
          pintadas = new Set(JSON.parse(salvoV1));
          salvarProgresso();
        } catch (e) {}
      }
    }

    function salvarProgresso() {
      const payload = {
        pintadas: Array.from(pintadas),
        roteiro: Array.from(roteiro),
        lados: document.getElementById('multiplicador-lados').value,
        atualizadoEm: new Date().toISOString()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    carregarEstadoLocal();

    // Carregar GeoJSON
    fetch('vias.geojson')
      .then(res => {
        if (!res.ok) throw new Error("Arquivo vias.geojson não encontrado.");
        return res.json();
      })
      .then(data => {
        dadosOriginais = data;
        data.features.forEach((f, idx) => {
          f._id = idx;
        });
        renderizarMapa();
        atualizarCalculosGlobais();
      })
      .catch(err => alert("Erro ao carregar vias.geojson: " + err.message));

    function alterarModo(novoModo) {
      modoAtual = novoModo;
      document.getElementById('modo-pintura').className = 'btn-modo' + (novoModo === 'pintura' ? ' ativo-pintura' : '');
      document.getElementById('modo-rota').className = 'btn-modo' + (novoModo === 'rota' ? ' ativo-rota' : '');
    }

    function estiloVia(feature) {
      const id = feature._id;
      const estaNoRoteiro = roteiro.has(id);
      const estaPintada = pintadas.has(id);
      const sentido = feature.properties[COL_SENTIDO];

      if (estaNoRoteiro) {
        return { color: '#9333ea', weight: 7, opacity: 0.95, dashArray: estaPintada ? '8, 6' : null };
      }
      if (estaPintada) {
        return { color: '#16a34a', weight: 6, opacity: 0.9 };
      }
      return {
        color: sentido === 'Vertical' ? '#2563eb' : '#f59e0b',
        weight: 4,
        opacity: 0.75
      };
    }

    function renderizarMapa() {
      if (!dadosOriginais) return;
      if (geojsonLayer) map.removeLayer(geojsonLayer);

      const filtro = document.getElementById('filtro-sentido').value;
      const fator = Number(document.getElementById('multiplicador-lados').value);

      geojsonLayer = L.geoJSON(dadosOriginais, {
        filter: (feature) => {
          if (filtro === 'TODOS') return true;
          if (filtro === 'PENDENTES') return !pintadas.has(feature._id);
          if (filtro === 'PINTADAS') return pintadas.has(feature._id);
          return feature.properties[COL_SENTIDO] === filtro;
        },
        style: estiloVia,
        onEachFeature: (feature, layer) => {
          const props = feature.properties;
          const nome = props[COL_NOME] || 'Via sem nome';
          const m = (Number(props[COL_METROS] || 0) * fator).toFixed(1);
          const sentido = props[COL_SENTIDO] || '-';

          layer.bindTooltip(() => {
            const status = roteiro.has(feature._id)
              ? '🟣 No Roteiro do Dia'
              : (pintadas.has(feature._id) ? '🟢 Pintura Concluída' : '⚪ Pendente');
            return `<b>${nome}</b><br>${m} m (${fator}x) • ${sentido}<br><small>${status}</small>`;
          });

          layer.on('click', () => {
            const id = feature._id;
            if (modoAtual === 'pintura') {
              if (pintadas.has(id)) pintadas.delete(id);
              else pintadas.add(id);
            } else {
              if (roteiro.has(id)) roteiro.delete(id);
              else roteiro.add(id);
            }
            salvarProgresso();
            geojsonLayer.resetStyle(layer);
            atualizarCalculosGlobais();
          });
        }
      }).addTo(map);
    }

    function atualizarCalculosGlobais() {
      if (!dadosOriginais) return;
      const fator = Number(document.getElementById('multiplicador-lados').value);

      let totalPoligonalM = 0;
      let totalPintadoM = 0;
      let totalRotaM = 0;

      dadosOriginais.features.forEach(f => {
        const m = Number(f.properties[COL_METROS] || 0) * fator;
        totalPoligonalM += m;
        if (pintadas.has(f._id)) totalPintadoM += m;
        if (roteiro.has(f._id)) totalRotaM += m;
      });

      const pct = totalPoligonalM > 0 ? ((totalPintadoM / totalPoligonalM) * 100) : 0;

      document.getElementById('pct-progresso').innerText = pct.toFixed(1) + '%';
      document.getElementById('resumo-geral').innerText =
        `${(totalPintadoM / 1000).toFixed(2)} km / ${(totalPoligonalM / 1000).toFixed(2)} km`;
      document.getElementById('barra-fill').style.width = Math.min(pct, 100).toFixed(1) + '%';

      document.getElementById('qtd-pintadas').innerText = pintadas.size;
      document.getElementById('total-pintado-m').innerText =
        totalPintadoM.toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' m';

      document.getElementById('qtd-rota').innerText = roteiro.size;
      document.getElementById('total-rota-m').innerText =
        totalRotaM.toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' m';

      salvarProgresso();
    }

    function converterRotaEmPintura() {
      if (roteiro.size === 0) return alert("Nenhuma via selecionada no Roteiro do Dia.");
      if (!confirm(`Confirmar conclusão da pintura das ${roteiro.size} vias do roteiro?`)) return;

      roteiro.forEach(id => pintadas.add(id));
      roteiro.clear();
      salvarProgresso();
      renderizarMapa();
      atualizarCalculosGlobais();
    }

    // Extrai ponto médio e ordena espacialmente (Vizinho Mais Próximo) para evitar zigue-zague
    function obterViasRoteiroOrdenadas() {
      const lista = [];
      roteiro.forEach(id => {
        const f = dadosOriginais.features[id];
        if (!f) return;
        const coords = f.geometry.type === 'MultiLineString'
          ? f.geometry.coordinates[0]
          : f.geometry.coordinates;
        const meio = coords[Math.floor(coords.length / 2)];
        lista.push({
          feature: f,
          lat: meio[1],
          lng: meio[0],
          coordStr: `${meio[1].toFixed(6)},${meio[0].toFixed(6)}`
        });
      });

      if (lista.length <= 2) return lista;

      // Algoritmo Nearest Neighbor partindo do primeiro item
      const ordenadas = [lista.shift()];
      while (lista.length > 0) {
        const atual = ordenadas[ordenadas.length - 1];
        let melhorIdx = 0;
        let menorDist = Infinity;

        for (let i = 0; i < lista.length; i++) {
          const dLat = atual.lat - lista[i].lat;
          const dLng = atual.lng - lista[i].lng;
          const dist = dLat * dLat + dLng * dLng;
          if (dist < menorDist) {
            menorDist = dist;
            melhorIdx = i;
          }
        }
        ordenadas.push(lista.splice(melhorIdx, 1)[0]);
      }
      return ordenadas;
    }

    function gerarLinkGoogleMaps(viasOrdenadas) {
      // Google Maps URL suporta até 10 pontos (1 destino + 9 waypoints)
      const limite = viasOrdenadas.slice(0, 10);
      const destino = limite[limite.length - 1].coordStr;
      const waypoints = limite.slice(0, -1).map(v => v.coordStr).join('|');
      let url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destino)}&travelmode=walking`;
      if (waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
      return url;
    }

    function abrirGoogleMaps() {
      if (roteiro.size === 0) {
        return alert("Selecione as ruas usando o modo 'Montar Roteiro Garis' primeiro.");
      }
      const ordenadas = obterViasRoteiroOrdenadas();
      if (ordenadas.length > 10) {
        alert("Aviso: O Google Maps limita rotas por link a 10 paradas. Serão enviadas as 10 primeiras vias sequenciadas.");
      }
      window.open(gerarLinkGoogleMaps(ordenadas), '_blank');
    }

    function enviarWhatsApp() {
      if (roteiro.size === 0) {
        return alert("Selecione as ruas usando o modo 'Montar Roteiro Garis' primeiro.");
      }
      const fator = Number(document.getElementById('multiplicador-lados').value);
      const ordenadas = obterViasRoteiroOrdenadas();
      let totalM = 0;

      const linhasRuas = ordenadas.map((item, index) => {
        const props = item.feature.properties;
        const nome = props[COL_NOME] || 'Trecho sem nome';
        const m = Number(props[COL_METROS] || 0) * fator;
        totalM += m;
        return `${index + 1}. ${nome} (${m.toFixed(0)}m)`;
      });

      const linkMaps = gerarLinkGoogleMaps(ordenadas);
      const texto =
        `*ROTEIRO PINTURA DE MEIO-FIO • CENTRO*\n` +
        `Lados: ${fator}x | Total: ${totalM.toFixed(0)}m (${(totalM / 1000).toFixed(2)} km)\n\n` +
        `*Sequência de Vias:*\n${linhasRuas.join('\n')}\n\n` +
        `*Abrir Rota no Google Maps:*\n${linkMaps}`;

      window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
    }

    // Exportar Relatório CSV (compatível com Excel)
    function exportarCSV() {
      if (!dadosOriginais) return;
      const fator = Number(document.getElementById('multiplicador-lados').value);
      const linhas = ["ID;Nome_Via;Sentido;Status;Metros_Eixo;Fator_Lados;Metros_Totais;Km_Totais"];

      dadosOriginais.features.forEach(f => {
        const p = f.properties;
        const nome = (p[COL_NOME] || 'Sem nome').replace(/;/g, ',');
        const sentido = p[COL_SENTIDO] || '-';
        const mBase = Number(p[COL_METROS] || 0);
        const mTotal = mBase * fator;
        const kmTotal = mTotal / 1000;
        const status = pintadas.has(f._id) ? 'Pintada' : (roteiro.has(f._id) ? 'No Roteiro' : 'Pendente');

        linhas.push(`${f._id};"${nome}";${sentido};${status};${mBase.toFixed(2)};${fator};${mTotal.toFixed(2)};${kmTotal.toFixed(3)}`);
      });

      baixarArquivo("\uFEFF" + linhas.join("\n"), `relatorio_pintura_centro_${dataHoje()}.csv`, "text/csv;charset=utf-8;");
    }

    // Exportar GeoJSON atualizado para abrir no QGIS
    function exportarGeoJSON() {
      if (!dadosOriginais) return;
      const fator = Number(document.getElementById('multiplicador-lados').value);
      const copia = JSON.parse(JSON.stringify(dadosOriginais));

      copia.features.forEach(f => {
        const id = f._id;
        delete f._id;
        const mBase = Number(f.properties[COL_METROS] || 0);
        f.properties.status_pintura = pintadas.has(id) ? 'Concluida' : (roteiro.has(id) ? 'Roteiro' : 'Pendente');
        f.properties.fator_lados = fator;
        f.properties.metros_calc = Number((mBase * fator).toFixed(2));
      });

      baixarArquivo(JSON.stringify(copia, null, 2), `vias_centro_atualizado_${dataHoje()}.geojson`, "application/geo+json");
    }

    // Backup e Restauração entre celulares
    function exportarBackup() {
      const dados = localStorage.getItem(STORAGE_KEY) || '{}';
      baixarArquivo(dados, `backup_pintura_fortaleza_${dataHoje()}.json`, "application/json");
    }

    function importarBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed.pintadas)) throw new Error("Formato inválido.");
          pintadas = new Set(parsed.pintadas);
          roteiro = new Set(parsed.roteiro || []);
          if (parsed.lados) document.getElementById('multiplicador-lados').value = parsed.lados;
          salvarProgresso();
          renderizarMapa();
          atualizarCalculosGlobais();
          alert("Progresso restaurado com sucesso!");
        } catch (err) {
          alert("Erro ao ler arquivo de backup: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function limparDados() {
      const opcao = prompt(
        "Digite:\n1 - Para limpar APENAS o Roteiro do Dia\n2 - Para zerar TODO o progresso (Pintadas + Roteiro)"
      );
      if (opcao === '1') {
        roteiro.clear();
      } else if (opcao === '2') {
        if (!confirm("Tem certeza que deseja apagar todo o histórico de vias pintadas?")) return;
        pintadas.clear();
        roteiro.clear();
      } else {
        return;
      }
      salvarProgresso();
      renderizarMapa();
      atualizarCalculosGlobais();
    }

    function baixarArquivo(conteudo, nomeArquivo, tipoMime) {
      const blob = new Blob([conteudo], { type: tipoMime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nomeArquivo;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function dataHoje() {
      return new Date().toISOString().slice(0, 10);
    }

    // Legenda no canto inferior direito
    const legenda = L.control({ position: 'bottomright' });
    legenda.onAdd = function () {
      const div = L.DomUtil.create('div', 'legenda');
      div.innerHTML = `
        <div><span class="cor" style="background:#2563eb"></span>Vertical (Pendente)</div>
        <div><span class="cor" style="background:#f59e0b"></span>Horizontal (Pendente)</div>
        <div><span class="cor" style="background:#16a34a; height:5px"></span>Pintura Concluída</div>
        <div><span class="cor" style="background:#9333ea; height:6px"></span>Roteiro do Dia</div>
      `;
      return div;
    };
    legenda.addTo(map);
  </script>
