<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Pintura - Centro de Fortaleza</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f4f6f8; }
    
    /* Painel Superior */
    #painel {
      background: #1e293b; color: white; padding: 12px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 1000;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    }
    .titulo h1 { font-size: 1.1rem; color: #38bdf8; }
    .titulo p { font-size: 0.8rem; color: #cbd5e1; }
    
    .contadores { display: flex; gap: 15px; background: #0f172a; padding: 8px 14px; border-radius: 8px; }
    .box-num { text-align: center; }
    .box-num span { display: block; font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
    .box-num strong { font-size: 1.15rem; color: #4ade80; }

    .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
    select, button {
      padding: 8px 12px; border-radius: 6px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    select { background: #334155; color: white; }
    .btn-rota { background: #2563eb; color: white; }
    .btn-rota:hover { background: #1d4ed8; }
    .btn-zap { background: #16a34a; color: white; }
    .btn-zap:hover { background: #15803d; }
    .btn-limpar { background: #dc2626; color: white; }

    /* Mapa */
    #map { flex: 1; width: 100%; }

    /* Legenda Flutuante */
    .legenda {
      background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-size: 0.8rem; line-height: 1.6;
    }
    .cor { display: inline-block; width: 14px; height: 4px; margin-right: 6px; vertical-align: middle; }
  </style>
</head>
<body>

  <div id="painel">
    <div class="titulo">
      <h1>Pintura de Meio-Fio • Centro</h1>
      <p>Clique nas ruas para marcar como pintadas ou montar rota</p>
    </div>

    <div class="contadores">
      <div class="box-num">
        <span>Vias Selecionadas</span>
        <strong id="qtd-vias">0</strong>
      </div>
      <div class="box-num">
        <span>Total Metros</span>
        <strong id="total-m">0 m</strong>
      </div>
      <div class="box-num">
        <span>Total Km</span>
        <strong id="total-km">0.000 km</strong>
      </div>
    </div>

    <div class="acoes">
      <select id="filtro-sentido" onchange="filtrarVias()">
        <option value="TODOS">Todas as Vias</option>
        <option value="Vertical">Apenas Verticais</option>
        <option value="Horizontal">Apenas Horizontais</option>
      </select>
      <button class="btn-rota" onclick="abrirGoogleMaps()">🗺️ Abrir Rota Maps</button>
      <button class="btn-zap" onclick="enviarWhatsApp()">📲 Enviar p/ Garis</button>
      <button class="btn-limpar" onclick="limparSelecao()">Limpar</button>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com"></script>
  <script>
    // 1. CONFIGURAÇÃO DOS NOMES DAS COLUNAS DO SEU GEOJSON
    const COL_NOME = "name";       // Altere se sua coluna de nome tiver outro título
    const COL_METROS = "metros";   // Coluna com valor em metros
    const COL_KM = "km";           // Coluna com valor em km
    const COL_SENTIDO = "Sentido"; // Coluna com 'Vertical' ou 'Horizontal'

    // Inicializa o mapa focado no Centro de Fortaleza
    const map = L.map('map').setView([-3.7275, -38.5275], 15);

    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    let geojsonLayer;
    let dadosOriginais;
    let selecionadas = new Map(); // Guarda as ruas marcadas

    // Carrega o progresso salvo no navegador do celular/PC
    const salvo = JSON.parse(localStorage.getItem('pintura_fortaleza') || '[]');

    // Busca o arquivo vias.geojson na mesma pasta
    fetch('vias.geojson')
      .then(res => res.json())
      .then(data => {
        dadosOriginais = data;
        // Restaura seleções anteriores
        data.features.forEach((f, idx) => {
          f._id = idx;
          if (salvo.includes(idx)) selecionadas.set(idx, f);
        });
        renderizarMapa();
        atualizarTotais();
      })
      .catch(err => alert("Erro ao carregar vias.geojson. Verifique se o arquivo está na mesma pasta."));

    function estiloVia(feature) {
      const marcada = selecionadas.has(feature._id);
      const sentido = feature.properties[COL_SENTIDO];
      if (marcada) {
        return { color: '#16a34a', weight: 6, opacity: 0.95 }; // Verde = Pintada / Selecionada
      }
      return {
        color: sentido === 'Vertical' ? '#2563eb' : '#f59e0b', // Azul = Vertical | Laranja = Horizontal
        weight: 4,
        opacity: 0.75
      };
    }

    function renderizarMapa() {
      if (geojsonLayer) map.removeLayer(geojsonLayer);
      const filtro = document.getElementById('filtro-sentido').value;

      geojsonLayer = L.geoJSON(dadosOriginais, {
        filter: (feature) => {
          if (filtro === 'TODOS') return true;
          return feature.properties[COL_SENTIDO] === filtro;
        },
        style: estiloVia,
        onEachFeature: (feature, layer) => {
          const props = feature.properties;
          const nome = props[COL_NOME] || 'Via sem nome';
          const m = Number(props[COL_METROS] || 0).toFixed(2);
          const km = Number(props[COL_KM] || 0).toFixed(3);
          const sentido = props[COL_SENTIDO] || '-';

          layer.bindTooltip(`<b>${nome}</b><br>${m} m (${km} km) • ${sentido}`);

          layer.on('click', () => {
            if (selecionadas.has(feature._id)) {
              selecionadas.delete(feature._id);
            } else {
              selecionadas.set(feature._id, feature);
            }
            salvarProgresso();
            geojsonLayer.resetStyle(layer);
            atualizarTotais();
          });
        }
      }).addTo(map);
    }

    function filtrarVias() {
      renderizarMapa();
    }

    function atualizarTotais() {
      let totalM = 0;
      let totalKm = 0;

      selecionadas.forEach(f => {
        totalM += Number(f.properties[COL_METROS] || 0);
        totalKm += Number(f.properties[COL_KM] || 0);
      });

      document.getElementById('qtd-vias').innerText = selecionadas.size;
      document.getElementById('total-m').innerText = totalM.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' m';
      document.getElementById('total-km').innerText = totalKm.toFixed(3) + ' km';
    }

    function salvarProgresso() {
      localStorage.setItem('pintura_fortaleza', JSON.stringify(Array.from(selecionadas.keys())));
    }

    function limparSelecao() {
      if (!confirm("Deseja desmarcar todas as ruas?")) return;
      selecionadas.clear();
      salvarProgresso();
      renderizarMapa();
      atualizarTotais();
    }

    // Pega coordenadas centrais de cada rua selecionada para montar rota no Google Maps
    function obterPontosRota() {
      const pontos = [];
      selecionadas.forEach(f => {
        const coords = f.geometry.type === 'MultiLineString' ? f.geometry.coordinates[0] : f.geometry.coordinates;
        const meio = coords[Math.floor(coords.length / 2)];
        pontos.push(`${meio[1]},${meio[0]}`); // lat,lng
      });
      return pontos;
    }

    function abrirGoogleMaps() {
      if (selecionadas.size === 0) return alert("Selecione pelo menos 1 rua no mapa.");
      const pontos = obterPontosRota().slice(0, 10); // Google Maps aceita até 10 paradas na URL gratuita
      const destino = pontos[pontos.length - 1];
      const paradas = pontos.slice(0, -1).join('|');
      const url = `https://google.com{destino}&waypoints=${paradas}&travelmode=walking`;
      window.open(url, '_blank');
    }

    function enviarWhatsApp() {
      if (selecionadas.size === 0) return alert("Selecione as ruas da rota primeiro.");
      let listaRuas = [];
      let totalM = 0;

      selecionadas.forEach(f => {
        const nome = f.properties[COL_NOME] || 'Trecho sem nome';
        const m = Number(f.properties[COL_METROS] || 0).toFixed(0);
        listaRuas.push(`• ${nome} (${m}m)`);
        totalM += Number(f.properties[COL_METROS] || 0);
      });

      const pontos = obterPontosRota().slice(0, 10);
      const linkMaps = `https://google.com{pontos[pontos.length - 1]}&waypoints=${pontos.slice(0, -1).join('|')}&travelmode=walking`;

      const texto = `*ROTEIRO PINTURA DE MEIO-FIO*\n` +
                    `Total: ${totalM.toFixed(0)}m (${(totalM/1000).toFixed(2)} km)\n\n` +
                    `*Vias:*\n${listaRuas.join('\n')}\n\n` +
                    `*Abrir Rota no Mapa:*\n${linkMaps}`;

      window.open(`https://wa.me{encodeURIComponent(texto)}`, '_blank');
    }

    // Legenda no canto inferior
    const legenda = L.control({ position: 'bottomright' });
    legenda.onAdd = function () {
      const div = L.DomUtil.create('div', 'legenda');
      div.innerHTML = `
        <div><span class="cor" style="background:#2563eb"></span>Vertical (Pendente)</div>
        <div><span class="cor" style="background:#f59e0b"></span>Horizontal (Pendente)</div>
        <div><span class="cor" style="background:#16a34a"></span>Selecionada / Concluída</div>
      `;
      return div;
    };
    legenda.addTo(map);
  </script>
</body>
</html>
